# SIGAB WebPanel — Nginx en VPS Bluehost
# Dominio público: sigab.129-121-100-147.sslip.io  (IP 129.121.100.147)

server {
    listen 80;
    server_name sigab.129-121-100-147.sslip.io;
    root /var/www/sigah/dist;
    index index.html;

    # Frontend — SPA routing (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Backend API (Express en :8000)
    location /auth/ {
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
    location /api/ {
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
    location /health {
        proxy_pass http://127.0.0.1:8000;
    }
}

# SSL con Certbot (recomendado):
#   sudo certbot --nginx -d sigab.129-121-100-147.sslip.io
# Certbot añade automáticamente el bloque 443 + redirect 80->443 + HSTS.
