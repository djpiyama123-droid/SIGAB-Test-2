name: Deploy SIGAB → VPS Bluehost

on:
  push:
    branches: [ v4.0/piloto-clinica-1 ]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest

    steps:
      - name: SSH deploy al VPS
      uses: appleboy/ssh-action@v1.2.0
        with:
        host: ${{ secrets.VPS_IP }}
          username: root
        key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /opt/sigab

            # Traer últimos cambios
          git fetch origin && git checkout v4.0/piloto-clinica-1 && git reset --hard origin/v4.0/piloto-clinica-1

            # Reconstruir y reiniciar contenedores si cambiaron
            docker compose --env-file .env up -d --build

            # Rebuild frontend si cambió
            cd sigab-frontend
            npm ci --silent
            npm run build
            cd ..

            # Recargar Nginx para tomar el nuevo dist/
            nginx -t && systemctl reload nginx

            echo "SIGAB actualizado: $(date)"
