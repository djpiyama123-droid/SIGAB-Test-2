name: Deploy SIGAH → VPS Bluehost

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Forzar rebuild completo (backend + frontend)'
        required: false
        type: boolean
        default: false

jobs:
  deploy:
    name: Deploy to VPS Bluehost
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test_root_pass
          MYSQL_DATABASE:      sigah_test
          MYSQL_USER:          sigah_user
          MYSQL_PASSWORD:      test_pass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u sigah_user -ptest_pass"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      SIGAH_DB_HOST:            127.0.0.1
      SIGAH_DB_PORT:            3306
      SIGAH_DB_USER:            sigah_user
      SIGAH_DB_PASS:            test_pass
      SIGAH_DB_NAME:            sigah_test
      SIGAH_JWT_SECRET:         REDACTED_CI_SECRET
      SIGAH_JWT_ALGORITHM:      HS256
      SIGAH_JWT_EXPIRE_MINUTES: 60
      SIGAH_DISABLE_COPILOT:    1

    steps:
      - name: Checkout (para detectar qué cambió)
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detectar cambios
        id: changes
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "ALL")
          echo "changed=$CHANGED" >> $GITHUB_OUTPUT
          if echo "$CHANGED" | grep -q "sigah-backend/"; then
            echo "backend=true" >> $GITHUB_OUTPUT
          else
            echo "backend=false" >> $GITHUB_OUTPUT
          fi
          if echo "$CHANGED" | grep -q "sigah-frontend/"; then
            echo "frontend=true" >> $GITHUB_OUTPUT
          else
            echo "frontend=false" >> $GITHUB_OUTPUT
          fi

      - name: Deploy via SSH (key auth)
        uses: appleboy/ssh-action@v1.2.0
        env:
          FORCE_REBUILD: ${{ inputs.force_rebuild }}
          BACKEND_CHANGED: ${{ steps.changes.outputs.backend }}
          FRONTEND_CHANGED: ${{ steps.changes.outputs.frontend }}
        with:
          host: ${{ secrets.VPS_IP }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: FORCE_REBUILD,BACKEND_CHANGED,FRONTEND_CHANGED
          script: |
            set -e
            cd /opt/sigah

            echo "=== SIGAH Deploy $(date) ==="
            echo "  Backend changed: $BACKEND_CHANGED"
            echo "  Frontend changed: $FRONTEND_CHANGED"
            echo "  Force rebuild: $FORCE_REBUILD"

            # Traer últimos cambios
            git fetch origin && git checkout main && git pull origin main

            # Rebuild backend si cambió (o force)
            if [ "$BACKEND_CHANGED" = "true" ] || [ "$FORCE_REBUILD" = "true" ]; then
              echo "--- Rebuilding backend ---"
              docker compose --env-file .env build sigah-backend
              docker compose --env-file .env up -d sigah-backend
            fi

            # Rebuild frontend si cambió (o force)
            if [ "$FRONTEND_CHANGED" = "true" ] || [ "$FORCE_REBUILD" = "true" ]; then
              echo "--- Rebuilding frontend ---"
              cd sigah-frontend
              npm ci --prefer-offline --silent
              npm run build
              cd ..
              nginx -t && systemctl reload nginx
            fi

            # Health check
            sleep 3
            STATUS=$(curl -sf http://localhost:8000/health || echo "FAIL")
            if [ "$STATUS" = "FAIL" ]; then
              echo "[ERROR] Backend no responde después del deploy"
              docker compose logs sigah-backend --tail=30
              exit 1
            fi
            echo "=== Deploy completado. Backend: $STATUS ==="

      - name: Notificar resultado
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "Deploy exitoso a http://${{ secrets.VPS_IP }}"
          else
            echo "Deploy fallido. Revisar logs arriba."
          fi
