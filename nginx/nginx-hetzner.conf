server {
    listen 80;
    server_name _;
    client_max_body_size 20M;

    # Proxy API, uploads y health al backend FastAPI
    location /api/ {
        proxy_pass http://sigah-backend:8000/api/;
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
        proxy_read_timeout 60s;
    }

    location /static/ {
        proxy_pass http://sigah-backend:8000/static/;
        proxy_set_header Host $host;
    }

    location /health {
        proxy_pass http://sigah-backend:8000/health;
    }

    location /docs {
        proxy_pass http://sigah-backend:8000/docs;
    }

    # Frontend React SPA (nginx del contenedor sigah-frontend sirve el build)
    location / {
        proxy_pass         http://sigah-frontend:80;
        proxy_set_header   Host             $host;
        proxy_set_header   X-Real-IP        $remote_addr;
        proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
