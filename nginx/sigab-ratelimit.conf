# ============================================================================
# sigab-ratelimit.conf — Capa 1 (reverse proxy) de DISENO_RATE_LIMITING.md
# ============================================================================
# Frena ráfagas y conexiones abusivas por IP ANTES de tocar la app FastAPI.
# La Capa 2 (token bucket por identidad) ya vive en
# sigab-backend/middleware/rate_limit.py.
#
# ⚠️ PRODUCCIÓN HOY USA TRAEFIK, no Nginx directo. Este archivo es para:
#   (a) el contenedor frontend nginx:alpine si se decide proxyear /api por él, o
#   (b) un Nginx de borde si se migra desde Traefik.
# Para el equivalente en Traefik (labels docker), ver TRAEFIK_RATELIMIT.md.
#
# EDITAR antes de usar: la subred real de la LAN del hospital (la entrega
# Sistemas con la IP). Mientras tanto se usan rangos privados comunes.
# ============================================================================

# ── Zonas de límite (declarar en el bloque http{}) ──────────────────────────
limit_req_zone   $binary_remote_addr      zone=perip:10m    rate=10r/s;
limit_req_zone   $http_x_sigab_user       zone=peruser:10m  rate=20r/s;
limit_conn_zone  $binary_remote_addr      zone=connperip:10m;

# Allowlist LAN + Tailscale: 1 = exento de límite agresivo. EDITA la subred LAN.
geo $sigab_lan {
    default        0;
    10.0.0.0/8     1;   # privadas (ajustar a la subred real del hospital)
    172.16.0.0/12  1;
    192.168.0.0/16 1;
    100.64.0.0/10  1;   # Tailscale (administración)
}
map $sigab_lan $perip_key { 1 ""; 0 $binary_remote_addr; }  # vacío = exento

