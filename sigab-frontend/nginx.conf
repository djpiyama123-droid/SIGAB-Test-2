server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: cualquier ruta no encontrada se entrega como index.html
    # React Router maneja el routing del lado del cliente
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache agresivo para assets con hash de contenido (generados por Vite)
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # No cachear index.html para que el cliente siempre tenga la versión más reciente
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
