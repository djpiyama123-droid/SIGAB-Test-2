version: '3.8'

# ================================================================
# SIGAH — Docker Compose (100% On-Premise)
# HGR No.1 IMSS Tijuana
# ================================================================

services:
  # ── MySQL 8.0 ─────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: sigah-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASS:-sigah_root_2026}
      MYSQL_DATABASE:      ${DB_NAME:-sigah}
      MYSQL_USER:          ${DB_USER:-sigah_user}
      MYSQL_PASSWORD:      ${DB_PASS:-sigah_pass_2026}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - sigah_mysql_data:/var/lib/mysql
      - ./database/sigab_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./database/seed_data.sql:/docker-entrypoint-initdb.d/02_seed.sql
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --event-scheduler=ON
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1",
             "-u", "${DB_USER:-sigah_user}", "-p${DB_PASS:-sigah_pass_2026}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── FastAPI Backend ────────────────────────────────────────
  backend:
    build:
      context: ./sigab-backend
      dockerfile: Dockerfile
    container_name: sigah-backend
    restart: always
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    environment:
      SIGAH_DB_HOST: mysql
      SIGAH_DB_PORT: 3306
      SIGAH_DB_USER: ${DB_USER:-sigah_user}
      SIGAH_DB_PASS: ${DB_PASS:-sigah_pass_2026}
      SIGAH_DB_NAME: ${DB_NAME:-sigah}
      SIGAH_UPLOAD_DIR: /app/static/uploads
      SIGAH_JWT_SECRET: ${SIGAH_JWT_SECRET:-dev-secret-CAMBIAR-EN-PRODUCCION}
      SIGAH_PUBLIC_BASE_URL: ${SIGAH_PUBLIC_BASE_URL:-http://localhost:5173}
      SIGAH_CORS_EXTRA: ${SIGAH_CORS_EXTRA:-}
      SIGAH_OLLAMA_HOST: ${SIGAH_OLLAMA_HOST:-http://host-gateway:11434}
      SIGAH_GEMMA_MODEL: ${SIGAH_GEMMA_MODEL:-qwen-claw}
      SIGAH_VISION_MODEL: ${SIGAH_VISION_MODEL:-gemma4-claw}
      SIGAH_DISABLE_COPILOT: ${SIGAH_DISABLE_COPILOT:-0}
      SIGAH_LLM_API_MODE: ${SIGAH_LLM_API_MODE:-ollama}
      SIGAH_LLM_API_BASE: ${SIGAH_LLM_API_BASE:-https://api.minimax.io/v1}
      SIGAH_LLM_API_KEY: ${SIGAH_LLM_API_KEY:-}
      SIGAH_LLM_MODEL: ${SIGAH_LLM_MODEL:-MiniMax-M3}
      BOT_API_KEYS: ${BOT_API_KEYS:-}
    extra_hosts:
      - "host-gateway:host-gateway"
    volumes:
      - sigab_uploads:/app/static/uploads
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import urllib.request,sys; sys.exit(0 if urllib.request.urlopen(\"http://localhost:8000/health\",timeout=3).status==200 else 1)'"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - default
      - hostedapps_default
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=hostedapps_default"
      - "traefik.http.routers.sigah-api.rule=(Host(`sigab.129-121-100-147.sslip.io`) || Host(`sigah.129-121-100-147.sslip.io`)) && (PathPrefix(`/api`) || PathPrefix(`/static`) || PathPrefix(`/health`) || PathPrefix(`/docs`))"
      - "traefik.http.routers.sigah-api.entrypoints=web"
      - "traefik.http.routers.sigah-api.priority=100"
      - "traefik.http.routers.sigah-api.middlewares=sigah-redirect@docker"
      - "traefik.http.routers.sigah-api.service=sigah-api-svc"
      - "traefik.http.routers.sigah-api-s.rule=(Host(`sigab.129-121-100-147.sslip.io`) || Host(`sigah.129-121-100-147.sslip.io`)) && (PathPrefix(`/api`) || PathPrefix(`/static`) || PathPrefix(`/health`) || PathPrefix(`/docs`))"
      - "traefik.http.routers.sigah-api-s.entrypoints=websecure"
      - "traefik.http.routers.sigah-api-s.priority=100"
      - "traefik.http.routers.sigah-api-s.service=sigah-api-svc"
      - "traefik.http.routers.sigah-api-s.tls=true"
      - "traefik.http.routers.sigah-api-s.tls.certresolver=challenger"
      - "traefik.http.routers.sigah-api-s.middlewares=sigah-security@docker"
      - "traefik.http.services.sigah-api-svc.loadbalancer.server.port=8000"
      - "traefik.http.middlewares.sigah-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.sigah-redirect.redirectscheme.permanent=true"
      - "traefik.http.middlewares.sigah-security.headers.stsSeconds=63072000"
      - "traefik.http.middlewares.sigah-security.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.sigah-security.headers.stsPreload=true"
      - "traefik.http.middlewares.sigah-security.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.sigah-security.headers.frameDeny=true"
      - "traefik.http.middlewares.sigah-security.headers.browserXssFilter=true"
      - "traefik.http.middlewares.sigah-security.headers.referrerPolicy=strict-origin-when-cross-origin"
      - "traefik.http.middlewares.sigah-security.headers.permissionsPolicy=geolocation=(), microphone=(), camera=(), payment=(), usb=()"
      # Content-Security-Policy (PROD-004 cierre).
      # Origen único: el dominio público; allowlist explícita para Google Fonts (Inter/Outfit/Source Sans 3/JetBrains Mono)
      # y data:/blob: para imágenes (favicon SVG, fotos de equipos vía backend) y para el Worker de jsqr.
      # 'unsafe-inline' en style-src es necesario: el bundle inserta <style> dinámico (Sileo) y setAttribute('style', ...)
      # de React — calcular hashes de cada uno no es viable en build-time.
      # NO permite eval(), objetos, ni frames anidados.
      - "traefik.http.middlewares.sigah-security.headers.contentsecuritypolicy=default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob:; font-src 'self' https://fonts.gstatic.com data:; connect-src 'self'; worker-src 'self' blob:; child-src 'self' blob:; frame-src 'self' blob:; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"

  # ── SIGAH Bot WhatsApp (Baileys) ──────────────────────────────
  bot:
    build:
      context: ./sigab-bot
      dockerfile: Dockerfile
    container_name: sigah-bot
    restart: always
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      FASTAPI_BASE_URL: http://backend:8000
      BOT_PORT: 3000
      GRUPO_BIOMEDICOS: ${GRUPO_BIOMEDICOS:-Residentes de biomedica 2025}
      SUPERVISOR_JID_1: ${SUPERVISOR_JID_1:-526645534349@s.whatsapp.net}
      SUPERVISOR_JID_2: ${SUPERVISOR_JID_2:-526643057010@s.whatsapp.net}
      BOT_API_KEY: ${BOT_API_KEY:-}
      BOT_STANDBY: ${BOT_STANDBY:-0}
    volumes:
      - sigab_bot_auth:/app/auth_sigah
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health | grep -q 'ok' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ── Frontend estático (nginx:alpine sirviendo build) ─────────
  frontend:
    image: nginx:alpine
    container_name: sigah-frontend
    restart: always
    volumes:
      - ./sigab-frontend/dist:/usr/share/nginx/html:ro
      - ./nginx-frontend.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - hostedapps_default
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=hostedapps_default"
      - "traefik.http.routers.sigah-fe.rule=Host(`129.121.100.147`) || Host(`sigab.129-121-100-147.sslip.io`) || Host(`sigah.129-121-100-147.sslip.io`)"
      - "traefik.http.routers.sigah-fe.entrypoints=web"
      - "traefik.http.routers.sigah-fe.middlewares=sigah-redirect@docker"
      - "traefik.http.routers.sigah-fe.priority=10"
      - "traefik.http.routers.sigah-fe.service=sigah-fe-svc"
      - "traefik.http.routers.sigah-fe-s.rule=Host(`sigab.129-121-100-147.sslip.io`) || Host(`sigah.129-121-100-147.sslip.io`)"
      - "traefik.http.routers.sigah-fe-s.entrypoints=websecure"
      - "traefik.http.routers.sigah-fe-s.priority=10"
      - "traefik.http.routers.sigah-fe-s.service=sigah-fe-svc"
      - "traefik.http.routers.sigah-fe-s.tls=true"
      - "traefik.http.routers.sigah-fe-s.tls.certresolver=challenger"
      - "traefik.http.routers.sigah-fe-s.middlewares=sigah-security@docker"
      - "traefik.http.services.sigah-fe-svc.loadbalancer.server.port=80"

volumes:
  sigah_mysql_data:
    name: sigah_mysql_data
  sigab_uploads:
    name: sigab_uploads
  sigab_bot_auth:
    name: sigab_bot_auth

networks:
  default:
    name: sigah_default
  hostedapps_default:
    external: true
